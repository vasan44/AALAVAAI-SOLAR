<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="60%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="sun-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#f8b326" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f8b326" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="40%" stop-color="#f8b326"/>
      <stop offset="100%" stop-color="#f8b326" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#5c2d0a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5be"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="680" cy="80" r="90" fill="url(#sun-radial)" opacity="0.5"/>
  <circle cx="680" cy="80" r="48" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="680" cy="80" r="36" fill="#fff4c2"/>

  <!-- Sun rays -->
  <g stroke="#ffd166" stroke-width="2.5" opacity="0.6">
    <line x1="680" y1="20" x2="680" y2="8"/>
    <line x1="680" y1="140" x2="680" y2="152"/>
    <line x1="620" y1="80" x2="608" y2="80"/>
    <line x1="740" y1="80" x2="752" y2="80"/>
    <line x1="637" y1="37" x2="629" y2="29"/>
    <line x1="723" y1="123" x2="731" y2="131"/>
    <line x1="723" y1="37" x2="731" y2="29"/>
    <line x1="637" y1="123" x2="629" y2="131"/>
  </g>

  <!-- Clouds -->
  <g fill="rgba(255,255,255,0.15)">
    <ellipse cx="120" cy="70" rx="60" ry="22"/>
    <ellipse cx="160" cy="60" rx="50" ry="18"/>
    <ellipse cx="80" cy="65" rx="40" ry="16"/>
    <ellipse cx="350" cy="50" rx="70" ry="20"/>
    <ellipse cx="400" cy="42" rx="55" ry="16"/>
    <ellipse cx="310" cy="48" rx="45" ry="15"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="380" width="800" height="120" fill="#1a4a2e"/>
  <rect x="0" y="390" width="800" height="110" fill="#1e5233"/>
  <!-- Grass texture -->
  <g fill="#2d7a4a" opacity="0.6">
    <ellipse cx="50" cy="385" rx="30" ry="8"/>
    <ellipse cx="150" cy="382" rx="25" ry="7"/>
    <ellipse cx="300" cy="386" rx="35" ry="9"/>
    <ellipse cx="500" cy="383" rx="28" ry="7"/>
    <ellipse cx="680" cy="385" rx="32" ry="8"/>
    <ellipse cx="760" cy="382" rx="22" ry="6"/>
  </g>

  <!-- House body -->
  <rect x="180" y="260" width="280" height="130" fill="url(#wall)"/>
  <!-- House shadow -->
  <rect x="180" y="380" width="280" height="8" fill="rgba(0,0,0,0.2)"/>

  <!-- Roof -->
  <polygon points="160,265 320,170 480,265" fill="url(#roof)"/>
  <polygon points="160,265 175,265 320,175 465,265 480,265 320,170" fill="url(#roof)"/>
  <!-- Roof ridge -->
  <line x1="320" y1="170" x2="320" y2="175" stroke="#3d1a06" stroke-width="3"/>

  <!-- Solar panels on roof -->
  <!-- Panel row 1 -->
  <g transform="rotate(-28, 320, 220)">
    <!-- Panel 1 -->
    <rect x="220" y="195" width="52" height="36" rx="2" fill="url(#panel-face)" stroke="#2a5a8c" stroke-width="1"/>
    <line x1="220" y1="207" x2="272" y2="207" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="220" y1="219" x2="272" y2="219" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="237" y1="195" x2="237" y2="231" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="254" y1="195" x2="254" y2="231" stroke="#2a5a8c" stroke-width="0.8"/>
    <!-- Panel shine -->
    <rect x="222" y="197" width="20" height="8" rx="1" fill="rgba(255,255,255,0.08)"/>

    <!-- Panel 2 -->
    <rect x="278" y="195" width="52" height="36" rx="2" fill="url(#panel-face)" stroke="#2a5a8c" stroke-width="1"/>
    <line x1="278" y1="207" x2="330" y2="207" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="278" y1="219" x2="330" y2="219" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="295" y1="195" x2="295" y2="231" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="312" y1="195" x2="312" y2="231" stroke="#2a5a8c" stroke-width="0.8"/>
    <rect x="280" y="197" width="20" height="8" rx="1" fill="rgba(255,255,255,0.08)"/>

    <!-- Panel 3 -->
    <rect x="336" y="195" width="52" height="36" rx="2" fill="url(#panel-face)" stroke="#2a5a8c" stroke-width="1"/>
    <line x1="336" y1="207" x2="388" y2="207" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="336" y1="219" x2="388" y2="219" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="353" y1="195" x2="353" y2="231" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="370" y1="195" x2="370" y2="231" stroke="#2a5a8c" stroke-width="0.8"/>
    <rect x="338" y="197" width="20" height="8" rx="1" fill="rgba(255,255,255,0.08)"/>

    <!-- Row 2 -->
    <rect x="220" y="237" width="52" height="36" rx="2" fill="url(#panel-face)" stroke="#2a5a8c" stroke-width="1"/>
    <line x1="220" y1="249" x2="272" y2="249" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="220" y1="261" x2="272" y2="261" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="237" y1="237" x2="237" y2="273" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="254" y1="237" x2="254" y2="273" stroke="#2a5a8c" stroke-width="0.8"/>
    <rect x="222" y="239" width="20" height="8" rx="1" fill="rgba(255,255,255,0.08)"/>

    <rect x="278" y="237" width="52" height="36" rx="2" fill="url(#panel-face)" stroke="#2a5a8c" stroke-width="1"/>
    <line x1="278" y1="249" x2="330" y2="249" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="278" y1="261" x2="330" y2="261" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="295" y1="237" x2="295" y2="273" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="312" y1="237" x2="312" y2="273" stroke="#2a5a8c" stroke-width="0.8"/>
    <rect x="280" y="239" width="20" height="8" rx="1" fill="rgba(255,255,255,0.08)"/>

    <rect x="336" y="237" width="52" height="36" rx="2" fill="url(#panel-face)" stroke="#2a5a8c" stroke-width="1"/>
    <line x1="336" y1="249" x2="388" y2="249" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="336" y1="261" x2="388" y2="261" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="353" y1="237" x2="353" y2="273" stroke="#2a5a8c" stroke-width="0.8"/>
    <line x1="370" y1="237" x2="370" y2="273" stroke="#2a5a8c" stroke-width="0.8"/>
    <rect x="338" y="239" width="20" height="8" rx="1" fill="rgba(255,255,255,0.08)"/>
  </g>

  <!-- House door -->
  <rect x="295" y="320" width="50" height="70" rx="4" fill="#8b6914"/>
  <rect x="295" y="320" width="50" height="70" rx="4" fill="none" stroke="#6b4f10" stroke-width="2"/>
  <circle cx="338" cy="357" r="4" fill="#d4a017"/>

  <!-- Windows -->
  <rect x="200" y="290" width="55" height="45" rx="3" fill="#87ceeb" stroke="#ccc" stroke-width="2"/>
  <line x1="227" y1="290" x2="227" y2="335" stroke="#ccc" stroke-width="1.5"/>
  <line x1="200" y1="312" x2="255" y2="312" stroke="#ccc" stroke-width="1.5"/>
  <rect x="385" y="290" width="55" height="45" rx="3" fill="#87ceeb" stroke="#ccc" stroke-width="2"/>
  <line x1="412" y1="290" x2="412" y2="335" stroke="#ccc" stroke-width="1.5"/>
  <line x1="385" y1="312" x2="440" y2="312" stroke="#ccc" stroke-width="1.5"/>

  <!-- Inverter box on wall -->
  <rect x="455" y="300" width="30" height="40" rx="3" fill="#2c3e50" stroke="#1a252f" stroke-width="1.5"/>
  <rect x="459" y="305" width="22" height="14" rx="1" fill="#27ae60"/>
  <circle cx="465" cy="328" r="3" fill="#f8b326"/>
  <circle cx="475" cy="328" r="3" fill="#27ae60"/>

  <!-- Cable from panels to inverter -->
  <path d="M 430 280 Q 450 290 455 310" stroke="#333" stroke-width="2.5" fill="none" stroke-dasharray="4,2"/>

  <!-- Energy flow arrows -->
  <g fill="#f8b326" opacity="0.8" filter="url(#glow)">
    <polygon points="560,200 575,210 560,220" />
    <polygon points="590,200 605,210 590,220" />
    <polygon points="620,200 635,210 620,220" />
  </g>
  <text x="555" y="245" fill="#f8b326" font-size="11" font-family="Arial" font-weight="bold" opacity="0.9">ENERGY FLOW</text>

  <!-- Meter box -->
  <rect x="540" y="300" width="40" height="50" rx="3" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <rect x="545" y="308" width="30" height="18" rx="1" fill="#2c3e50"/>
  <text x="548" y="321" fill="#27ae60" font-size="8" font-family="monospace" font-weight="bold">3.2kW</text>
  <text x="548" y="338" fill="#7f8c8d" font-size="7" font-family="Arial">NET METER</text>

  <!-- Tree left -->
  <rect x="100" y="330" width="12" height="55" fill="#5d4037"/>
  <ellipse cx="106" cy="310" rx="32" ry="38" fill="#2e7d32"/>
  <ellipse cx="90" cy="325" rx="22" ry="28" fill="#388e3c"/>
  <ellipse cx="122" cy="322" rx="20" ry="26" fill="#43a047"/>

  <!-- Tree right -->
  <rect x="660" y="340" width="10" height="45" fill="#5d4037"/>
  <ellipse cx="665" cy="322" rx="28" ry="34" fill="#2e7d32"/>
  <ellipse cx="650" cy="335" rx="18" ry="24" fill="#388e3c"/>
  <ellipse cx="680" cy="332" rx="17" ry="22" fill="#43a047"/>

  <!-- Branding overlay -->
  <rect x="0" y="430" width="800" height="70" fill="rgba(10,20,40,0.7)"/>
  <text x="40" y="462" fill="#f8b326" font-size="22" font-family="Arial" font-weight="900" letter-spacing="2">REHOBOTH SOLAR</text>
  <text x="40" y="485" fill="rgba(255,255,255,0.75)" font-size="13" font-family="Arial">Professional Solar &amp; Electrical Service · Nagercoil</text>
  <text x="680" y="468" fill="#27ae60" font-size="14" font-family="Arial" font-weight="bold" text-anchor="middle">500+ Projects</text>
  <text x="680" y="486" fill="rgba(255,255,255,0.6)" font-size="11" font-family="Arial" text-anchor="middle">Completed</text>
</svg>
