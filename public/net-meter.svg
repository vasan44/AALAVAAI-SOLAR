<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <defs>
    <linearGradient id="bg-meter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2d4a"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0f2540"/>
    </linearGradient>
    <linearGradient id="green-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#2ecc71"/>
    </linearGradient>
    <linearGradient id="sun-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8b326"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
  </defs>

  <rect width="700" height="420" fill="url(#bg-meter)"/>

  <!-- Grid pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="60" x2="700" y2="60"/><line x1="0" y1="120" x2="700" y2="120"/>
    <line x1="0" y1="180" x2="700" y2="180"/><line x1="0" y1="240" x2="700" y2="240"/>
    <line x1="0" y1="300" x2="700" y2="300"/><line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="100" y1="0" x2="100" y2="420"/><line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/><line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/><line x1="600" y1="0" x2="600" y2="420"/>
  </g>

  <!-- Title -->
  <text x="350" y="38" fill="white" font-size="18" font-family="Arial" font-weight="900" text-anchor="middle" letter-spacing="1">NET METERING DASHBOARD</text>
  <text x="350" y="56" fill="rgba(255,255,255,0.45)" font-size="11" font-family="Arial" text-anchor="middle">Real-time solar generation and grid export tracking</text>

  <!-- Main meter card -->
  <rect x="30" y="72" width="200" height="240" rx="10" fill="url(#card-grad)" stroke="rgba(248,179,38,0.3)" stroke-width="1.5"/>
  <text x="130" y="98" fill="#f8b326" font-size="12" font-family="Arial" font-weight="bold" text-anchor="middle">SMART METER</text>
  <!-- Meter display -->
  <rect x="50" y="108" width="160" height="60" rx="4" fill="#0a1628"/>
  <text x="130" y="130" fill="rgba(255,255,255,0.4)" font-size="9" font-family="monospace" text-anchor="middle">UNITS EXPORTED</text>
  <text x="130" y="158" fill="#27ae60" font-size="28" font-family="monospace" font-weight="bold" text-anchor="middle">1 2 4 . 6</text>
  <!-- Meter dials -->
  <g fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5">
    <circle cx="75" cy="210" r="22"/>
    <circle cx="130" cy="210" r="22"/>
    <circle cx="185" cy="210" r="22"/>
  </g>
  <g fill="none" stroke="#f8b326" stroke-width="2.5" stroke-linecap="round">
    <line x1="75" y1="210" x2="75" y2="192" transform="rotate(120, 75, 210)"/>
    <line x1="130" y1="210" x2="130" y2="192" transform="rotate(200, 130, 210)"/>
    <line x1="185" y1="210" x2="185" y2="192" transform="rotate(60, 185, 210)"/>
  </g>
  <text x="75" y="214" fill="rgba(255,255,255,0.6)" font-size="10" font-family="monospace" text-anchor="middle">4</text>
  <text x="130" y="214" fill="rgba(255,255,255,0.6)" font-size="10" font-family="monospace" text-anchor="middle">7</text>
  <text x="185" y="214" fill="rgba(255,255,255,0.6)" font-size="10" font-family="monospace" text-anchor="middle">2</text>
  <text x="130" y="240" fill="rgba(255,255,255,0.35)" font-size="9" font-family="Arial" text-anchor="middle">kWh exported to grid</text>
  <!-- Status -->
  <circle cx="60" cy="290" r="6" fill="#27ae60"/>
  <text x="72" y="295" fill="rgba(255,255,255,0.7)" font-size="11" font-family="Arial">Grid Connected</text>
  <circle cx="60" cy="308" r="6" fill="#f8b326"/>
  <text x="72" y="313" fill="rgba(255,255,255,0.7)" font-size="11" font-family="Arial">Generating</text>

  <!-- Monthly savings card -->
  <rect x="250" y="72" width="200" height="240" rx="10" fill="url(#card-grad)" stroke="rgba(39,174,96,0.3)" stroke-width="1.5"/>
  <text x="350" y="98" fill="#27ae60" font-size="12" font-family="Arial" font-weight="bold" text-anchor="middle">MONTHLY SAVINGS</text>
  <!-- Big savings number -->
  <text x="350" y="145" fill="white" font-size="38" font-family="Arial" font-weight="900" text-anchor="middle">₹3,240</text>
  <text x="350" y="165" fill="rgba(255,255,255,0.4)" font-size="10" font-family="Arial" text-anchor="middle">this month</text>
  <!-- Bar chart -->
  <text x="265" y="190" fill="rgba(255,255,255,0.4)" font-size="9" font-family="Arial">Monthly trend</text>
  <g>
    <rect x="265" y="220" width="18" height="50" rx="2" fill="url(#green-bar)" opacity="0.6"/>
    <rect x="288" y="210" width="18" height="60" rx="2" fill="url(#green-bar)" opacity="0.7"/>
    <rect x="311" y="200" width="18" height="70" rx="2" fill="url(#green-bar)" opacity="0.8"/>
    <rect x="334" y="195" width="18" height="75" rx="2" fill="url(#green-bar)"/>
    <rect x="357" y="205" width="18" height="65" rx="2" fill="url(#green-bar)" opacity="0.9"/>
    <rect x="380" y="215" width="18" height="55" rx="2" fill="url(#green-bar)" opacity="0.7"/>
    <rect x="403" y="200" width="18" height="70" rx="2" fill="url(#green-bar)" opacity="0.85"/>
  </g>
  <g fill="rgba(255,255,255,0.3)" font-size="8" font-family="Arial" text-anchor="middle">
    <text x="274" y="280">Jun</text><text x="297" y="280">Jul</text><text x="320" y="280">Aug</text>
    <text x="343" y="280">Sep</text><text x="366" y="280">Oct</text><text x="389" y="280">Nov</text>
    <text x="412" y="280">Dec</text>
  </g>
  <text x="350" y="305" fill="rgba(255,255,255,0.35)" font-size="9" font-family="Arial" text-anchor="middle">Avg ₹2,800 / month saved</text>

  <!-- Generation card -->
  <rect x="470" y="72" width="200" height="240" rx="10" fill="url(#card-grad)" stroke="rgba(248,179,38,0.3)" stroke-width="1.5"/>
  <text x="570" y="98" fill="#f8b326" font-size="12" font-family="Arial" font-weight="bold" text-anchor="middle">TODAY'S GENERATION</text>
  <!-- Circular progress -->
  <circle cx="570" cy="175" r="60" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
  <circle cx="570" cy="175" r="60" fill="none" stroke="url(#sun-bar)" stroke-width="10"
    stroke-dasharray="283" stroke-dashoffset="70" stroke-linecap="round"
    transform="rotate(-90, 570, 175)"/>
  <text x="570" y="168" fill="white" font-size="24" font-family="Arial" font-weight="900" text-anchor="middle">18.4</text>
  <text x="570" y="186" fill="rgba(255,255,255,0.5)" font-size="10" font-family="Arial" text-anchor="middle">kWh today</text>
  <!-- Stats below -->
  <line x1="490" y1="248" x2="650" y2="248" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="530" y="268" fill="rgba(255,255,255,0.5)" font-size="9" font-family="Arial" text-anchor="middle">Peak</text>
  <text x="530" y="282" fill="#f8b326" font-size="14" font-family="Arial" font-weight="bold" text-anchor="middle">4.8 kW</text>
  <text x="610" y="268" fill="rgba(255,255,255,0.5)" font-size="9" font-family="Arial" text-anchor="middle">Exported</text>
  <text x="610" y="282" fill="#27ae60" font-size="14" font-family="Arial" font-weight="bold" text-anchor="middle">6.2 kWh</text>
  <text x="570" y="305" fill="rgba(255,255,255,0.35)" font-size="9" font-family="Arial" text-anchor="middle">75% capacity utilised</text>

  <!-- Bottom info bar -->
  <rect x="30" y="330" width="640" height="70" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <g>
    <text x="120" y="358" fill="rgba(255,255,255,0.45)" font-size="10" font-family="Arial" text-anchor="middle">System Size</text>
    <text x="120" y="378" fill="white" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle">5 kW</text>
    <line x1="220" y1="340" x2="220" y2="390" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="310" y="358" fill="rgba(255,255,255,0.45)" font-size="10" font-family="Arial" text-anchor="middle">Annual Savings</text>
    <text x="310" y="378" fill="#27ae60" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle">₹38,880</text>
    <line x1="410" y1="340" x2="410" y2="390" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="500" y="358" fill="rgba(255,255,255,0.45)" font-size="10" font-family="Arial" text-anchor="middle">Payback Period</text>
    <text x="500" y="378" fill="#f8b326" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle">4–5 Years</text>
    <line x1="590" y1="340" x2="590" y2="390" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="645" y="358" fill="rgba(255,255,255,0.45)" font-size="10" font-family="Arial" text-anchor="middle">CO₂ Saved</text>
    <text x="645" y="378" fill="#27ae60" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle">3.2 T</text>
  </g>
</svg>
