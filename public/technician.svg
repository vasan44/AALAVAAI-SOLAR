<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640">
  <defs>
    <linearGradient id="sky-about" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#2e6b9e"/>
    </linearGradient>
    <linearGradient id="roof-about" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8d0d8"/>
      <stop offset="100%" stop-color="#a8b4be"/>
    </linearGradient>
    <linearGradient id="panel-about" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="person-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8b326"/>
      <stop offset="100%" stop-color="#d4920f"/>
    </linearGradient>
    <radialGradient id="sun-about" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="60%" stop-color="#f8b326"/>
      <stop offset="100%" stop-color="#f8b326" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="560" height="640" fill="url(#sky-about)"/>

  <!-- Sun -->
  <circle cx="460" cy="80" r="60" fill="url(#sun-about)" opacity="0.6"/>
  <circle cx="460" cy="80" r="36" fill="#ffd166"/>
  <circle cx="460" cy="80" r="26" fill="#fff4c2"/>

  <!-- Clouds -->
  <g fill="rgba(255,255,255,0.18)">
    <ellipse cx="80" cy="60" rx="55" ry="18"/>
    <ellipse cx="120" cy="52" rx="45" ry="15"/>
    <ellipse cx="50" cy="58" rx="35" ry="13"/>
    <ellipse cx="280" cy="45" rx="60" ry="17"/>
    <ellipse cx="320" cy="38" rx="48" ry="14"/>
  </g>

  <!-- Flat rooftop surface -->
  <rect x="0" y="340" width="560" height="300" fill="url(#roof-about)"/>
  <rect x="0" y="340" width="560" height="6" fill="rgba(255,255,255,0.2)"/>
  <!-- Roof texture -->
  <g stroke="rgba(0,0,0,0.06)" stroke-width="1" fill="none">
    <line x1="0" y1="360" x2="560" y2="360"/>
    <line x1="0" y1="380" x2="560" y2="380"/>
    <line x1="0" y1="400" x2="560" y2="400"/>
    <line x1="0" y1="420" x2="560" y2="420"/>
    <line x1="0" y1="440" x2="560" y2="440"/>
    <line x1="0" y1="460" x2="560" y2="460"/>
    <line x1="0" y1="480" x2="560" y2="480"/>
    <line x1="0" y1="500" x2="560" y2="500"/>
    <line x1="0" y1="520" x2="560" y2="520"/>
    <line x1="0" y1="540" x2="560" y2="540"/>
    <line x1="0" y1="560" x2="560" y2="560"/>
    <line x1="0" y1="580" x2="560" y2="580"/>
    <line x1="0" y1="600" x2="560" y2="600"/>
    <line x1="0" y1="620" x2="560" y2="620"/>
  </g>

  <!-- Solar panels on roof -->
  <!-- Panel array -->
  <g fill="url(#panel-about)" stroke="#2a5a8c" stroke-width="1">
    <rect x="30" y="355" width="70" height="48" rx="2"/>
    <rect x="108" y="355" width="70" height="48" rx="2"/>
    <rect x="186" y="355" width="70" height="48" rx="2"/>
    <rect x="264" y="355" width="70" height="48" rx="2"/>
    <rect x="342" y="355" width="70" height="48" rx="2"/>
    <rect x="420" y="355" width="70" height="48" rx="2"/>
    <!-- Row 2 -->
    <rect x="30" y="410" width="70" height="48" rx="2"/>
    <rect x="108" y="410" width="70" height="48" rx="2"/>
    <rect x="186" y="410" width="70" height="48" rx="2"/>
    <rect x="264" y="410" width="70" height="48" rx="2"/>
    <rect x="342" y="410" width="70" height="48" rx="2"/>
    <rect x="420" y="410" width="70" height="48" rx="2"/>
  </g>
  <!-- Panel grid lines -->
  <g stroke="#2a5a8c" stroke-width="0.6" opacity="0.7">
    <line x1="53" y1="355" x2="53" y2="403"/><line x1="76" y1="355" x2="76" y2="403"/>
    <line x1="30" y1="371" x2="100" y2="371"/><line x1="30" y1="387" x2="100" y2="387"/>
    <line x1="131" y1="355" x2="131" y2="403"/><line x1="154" y1="355" x2="154" y2="403"/>
    <line x1="108" y1="371" x2="178" y2="371"/><line x1="108" y1="387" x2="178" y2="387"/>
    <line x1="209" y1="355" x2="209" y2="403"/><line x1="232" y1="355" x2="232" y2="403"/>
    <line x1="186" y1="371" x2="256" y2="371"/><line x1="186" y1="387" x2="256" y2="387"/>
    <line x1="287" y1="355" x2="287" y2="403"/><line x1="310" y1="355" x2="310" y2="403"/>
    <line x1="264" y1="371" x2="334" y2="371"/><line x1="264" y1="387" x2="334" y2="387"/>
    <line x1="365" y1="355" x2="365" y2="403"/><line x1="388" y1="355" x2="388" y2="403"/>
    <line x1="342" y1="371" x2="412" y2="371"/><line x1="342" y1="387" x2="412" y2="387"/>
    <line x1="443" y1="355" x2="443" y2="403"/><line x1="466" y1="355" x2="466" y2="403"/>
    <line x1="420" y1="371" x2="490" y2="371"/><line x1="420" y1="387" x2="490" y2="387"/>
    <!-- Row 2 -->
    <line x1="53" y1="410" x2="53" y2="458"/><line x1="76" y1="410" x2="76" y2="458"/>
    <line x1="30" y1="426" x2="100" y2="426"/><line x1="30" y1="442" x2="100" y2="442"/>
    <line x1="131" y1="410" x2="131" y2="458"/><line x1="154" y1="410" x2="154" y2="458"/>
    <line x1="108" y1="426" x2="178" y2="426"/><line x1="108" y1="442" x2="178" y2="442"/>
    <line x1="209" y1="410" x2="209" y2="458"/><line x1="232" y1="410" x2="232" y2="458"/>
    <line x1="186" y1="426" x2="256" y2="426"/><line x1="186" y1="442" x2="256" y2="442"/>
    <line x1="287" y1="410" x2="287" y2="458"/><line x1="310" y1="410" x2="310" y2="458"/>
    <line x1="264" y1="426" x2="334" y2="426"/><line x1="264" y1="442" x2="334" y2="442"/>
    <line x1="365" y1="410" x2="365" y2="458"/><line x1="388" y1="410" x2="388" y2="458"/>
    <line x1="342" y1="426" x2="412" y2="426"/><line x1="342" y1="442" x2="412" y2="442"/>
    <line x1="443" y1="410" x2="443" y2="458"/><line x1="466" y1="410" x2="466" y2="458"/>
    <line x1="420" y1="426" x2="490" y2="426"/><line x1="420" y1="442" x2="490" y2="442"/>
  </g>

  <!-- Technician figure (stylized) -->
  <!-- Safety helmet -->
  <ellipse cx="310" cy="195" rx="32" ry="20" fill="#f8b326"/>
  <rect x="278" y="205" width="64" height="10" rx="2" fill="#d4920f"/>
  <!-- Head -->
  <ellipse cx="310" cy="225" rx="22" ry="26" fill="#d4a574"/>
  <!-- Face details -->
  <ellipse cx="302" cy="222" rx="4" ry="5" fill="white"/>
  <ellipse cx="318" cy="222" rx="4" ry="5" fill="white"/>
  <circle cx="302" cy="223" r="2.5" fill="#3d2b1f"/>
  <circle cx="318" cy="223" r="2.5" fill="#3d2b1f"/>
  <path d="M 304 234 Q 310 239 316 234" stroke="#3d2b1f" stroke-width="1.5" fill="none"/>
  <!-- Safety vest / shirt -->
  <rect x="278" y="248" width="64" height="80" rx="4" fill="url(#person-shirt)"/>
  <!-- Vest stripes -->
  <rect x="278" y="260" width="64" height="6" fill="rgba(255,255,255,0.4)"/>
  <rect x="278" y="300" width="64" height="6" fill="rgba(255,255,255,0.4)"/>
  <!-- Rehoboth logo on vest -->
  <rect x="290" y="270" width="40" height="22" rx="2" fill="rgba(16,35,63,0.8)"/>
  <text x="310" y="285" fill="#f8b326" font-size="8" font-family="Arial" font-weight="bold" text-anchor="middle">REHOBOTH</text>
  <!-- Arms -->
  <rect x="248" y="252" width="30" height="14" rx="6" fill="url(#person-shirt)" transform="rotate(-30, 263, 259)"/>
  <rect x="342" y="252" width="30" height="14" rx="6" fill="url(#person-shirt)" transform="rotate(30, 357, 259)"/>
  <!-- Hands -->
  <ellipse cx="240" cy="278" rx="10" ry="8" fill="#d4a574"/>
  <ellipse cx="380" cy="278" rx="10" ry="8" fill="#d4a574"/>
  <!-- Tool in right hand -->
  <rect x="382" y="270" width="4" height="30" rx="2" fill="#555"/>
  <rect x="378" y="268" width="12" height="6" rx="2" fill="#888"/>
  <!-- Legs -->
  <rect x="285" y="325" width="22" height="70" rx="4" fill="#2c3e50"/>
  <rect x="313" y="325" width="22" height="70" rx="4" fill="#2c3e50"/>
  <!-- Boots -->
  <rect x="282" y="390" width="28" height="14" rx="3" fill="#1a252f"/>
  <rect x="310" y="390" width="28" height="14" rx="3" fill="#1a252f"/>

  <!-- Tool bag on roof -->
  <rect x="380" y="460" width="60" height="45" rx="4" fill="#8b6914"/>
  <rect x="380" y="460" width="60" height="8" rx="4" fill="#a07820"/>
  <rect x="395" y="455" width="30" height="8" rx="3" fill="#6b4f10"/>
  <!-- Tools sticking out -->
  <rect x="390" y="445" width="4" height="18" rx="1" fill="#555"/>
  <rect x="400" y="448" width="4" height="15" rx="1" fill="#888"/>
  <rect x="410" y="446" width="4" height="17" rx="1" fill="#555"/>
  <rect x="420" y="450" width="4" height="13" rx="1" fill="#888"/>

  <!-- Measuring tape on roof -->
  <circle cx="180" cy="480" r="18" fill="#f8b326"/>
  <circle cx="180" cy="480" r="12" fill="#d4920f"/>
  <text x="180" y="484" fill="white" font-size="8" font-family="Arial" font-weight="bold" text-anchor="middle">5m</text>

  <!-- Branding strip -->
  <rect x="0" y="600" width="560" height="40" fill="rgba(16,35,63,0.92)"/>
  <text x="280" y="618" fill="#f8b326" font-size="13" font-family="Arial" font-weight="900" text-anchor="middle">REHOBOTH SOLAR · Expert Installation Team</text>
  <text x="280" y="634" fill="rgba(255,255,255,0.6)" font-size="10" font-family="Arial" text-anchor="middle">Nagercoil · Kanyakumari District · Tamil Nadu</text>
</svg>
